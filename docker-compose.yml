services:
  tproxy-server:
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config.json:/app/config.json:ro
      - ./profiles.json:/app/profiles.json:ro
      - ./site:/app/site:ro
    depends_on:
      mtproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "addr=${ADMIN_LISTEN:-127.0.0.1:8091}; port=$${addr##*:}; wget -qO- \"http://127.0.0.1:$${port}/readyz\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mtproxy:
    image: alexbers/mtprotoproxy:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./backend-config.py:/home/tgproxy/config.py:ro
    healthcheck:
      test: ["CMD-SHELL", "addr=${MT_BACKEND:-127.0.0.1:8443}; port=$${addr##*:}; python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', int(sys.argv[1])))\" $$port"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s